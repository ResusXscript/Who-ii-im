<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHO I IM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0e14;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 5vw;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
      margin-bottom: 4vh;
    }

    .image-container {
      width: 100%;
      max-width: 450px;
      border: 2px solid #00ffcc;
      border-radius: 12px;
      padding: 10px;
      background-color: #131822;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <h1>WHO I IM</h1>

  <div class="image-container">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTealDXYKEh7ZzA5ImfIv63yhpoOdWMQ6vG4tKqqSMOng&s=10" alt="Profile Image">
  </div>

</body>
</html>
